name: IRAN REMAINS CONNECTED Windows Setup EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify tagged version matches source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from iran_proxy_monitor import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match source v$version" }
      - name: Verify tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build self-contained app and installer
        shell: pwsh
        run: .\release\build-windows.ps1
      - name: Verify bundled executable and generate SHA256SUMS
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/IranRemainsConnected/IranRemainsConnected.exe")) { throw "Bundled GUI exe missing" }
          if (-not (Test-Path "dist/IranRemainsConnected/bin/sing-box.exe")) { throw "Bundled sing-box core missing" }
          foreach ($required in @('LICENSE', 'THIRD_PARTY_NOTICES.md', 'SOURCE_AND_COMPLIANCE.md', 'LICENSE-sing-box.txt', 'LICENSE-PyYAML.txt')) {
            if (-not (Test-Path "dist/IranRemainsConnected/licenses/$required")) { throw "Missing license notice: $required" }
          }
          if (-not (Test-Path "release-output/sing-box-v1.14.4-source.zip")) { throw "sing-box corresponding source archive missing" }
          $installer = Get-ChildItem "release-output/" -Filter "IranRemainsConnected-Setup-v1.1-win64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Expected v1.1 Setup.exe missing" }
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding ascii "release-output/SHA256SUMS.txt"
      - name: Upload Setup.exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranRemainsConnected-Setup-Windows
          path: |
            release-output/*.exe
            release-output/SHA256SUMS.txt
            release-output/sing-box-v1.14.4-source.zip
            release-output/THIRD_PARTY_NOTICES.md
            release-output/SOURCE_AND_COMPLIANCE.md
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release-output\*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName release-output/SHA256SUMS.txt release-output/sing-box-v1.14.4-source.zip release-output/THIRD_PARTY_NOTICES.md release-output/SOURCE_AND_COMPLIANCE.md --title "IRAN REMAINS CONNECTED $env:GITHUB_REF_NAME" --generate-notes --verify-tag
